# Optional local retrieval fallback. Procedures belong to Research Tools Deployment:
# https://agent.wikip.co/research-tools-deployment/
# No production container is recreated by editing this file.
services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    pull_policy: missing
    container_name: research-flaresolverr
    environment:
      LOG_LEVEL: warn
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: UTC
    ports:
      - "127.0.0.1:8191:8191"
    restart: unless-stopped
    init: true
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
