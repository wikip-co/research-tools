[project]
name = "web-scraper"
version = "0.1.0"
description = "Agent-friendly research article scraper with structured JSON output"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scrapling[fetchers]>=0.4.1",
    "beautifulsoup4>=4.12.3",
    "markitdown>=0.0.1a3",
    "pypdf>=5.4.0",
    "content-agent-core",
]

[project.scripts]
web-scraper = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.sources]
content-agent-core = { workspace = true }

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]
