name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Python errors
        # Correctness rules only: syntax errors, undefined names, unused imports.
        run: make lint-python RUFF_VERSION=0.17.5

      - name: Shell syntax and ShellCheck errors
        run: make lint-shell

      - name: No host-specific paths in templates
        run: |
          ! grep -rn "/home/anthony" systemd/ .env.example

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: Run tests
        run: make test
